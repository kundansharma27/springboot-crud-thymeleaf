<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Best Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h1 class="text-center my-4">Products</h1>
    <a class="btn btn-primary" href="/products/create">Create Product</a>
    <table class = "table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Brand</th>
            <th>Category</th>
            <th>Price</th>
            <th>Image</th>
            <th>Created At</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="Product : ${products}">
        <td th:text="${Product.id}"></td>
        <td th:text="${Product.name}"></td>
        <td th:text="${Product.brand}"></td>
        <td th:text="${Product.category}"></td>
            <td th:text="${Product.price} + ' $'"></td>

            <td>
                <img th:src="@{/images/{img}(img=${Product.imageFileName})}"
                     alt="Product image"
                     width="100">

            </td>
        <td th:text="${Product.createdAt.toString().substring(0,10)}"></td>
        <td style="white-space:nowrap">
            <a class ="btn btn-primary btn-sm"
            <a th:href="@{/products/edit(id=${Product.id})}">Edit</a>


            <a class ="btn btn-danger btn-sm"
               th:href="@{/products/delete(id=${Product.id})}"
                onclick="return confirm('Are you sure?')">Delete</a>
        </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
